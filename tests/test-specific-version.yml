name: Test specific reviewdog version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Setup reviewdog at a pinned version
        uses: .
        with:
          reviewdog_version: v0.20.3

      - name: Assert reviewdog is on PATH
        run: |
          echo "Checking reviewdog is available..."
          if ! command -v reviewdog > /dev/null 2>&1; then
            echo "FAIL: reviewdog not found on PATH"
            exit 1
          fi
          echo "PASS: reviewdog found at $(command -v reviewdog)"

      - name: Assert reviewdog reports the expected version
        run: |
          VERSION_OUTPUT=$(reviewdog -version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.20.3"; then
            echo "PASS: version 0.20.3 confirmed"
          else
            echo "FAIL: expected version 0.20.3 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
