name: Test nightly reviewdog installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Setup reviewdog (nightly)
        uses: .
        with:
          reviewdog_version: nightly

      - name: Assert reviewdog is on PATH
        run: |
          echo "Checking reviewdog is available..."
          if ! command -v reviewdog > /dev/null 2>&1; then
            echo "FAIL: reviewdog not found on PATH"
            exit 1
          fi
          echo "PASS: reviewdog found at $(command -v reviewdog)"

      - name: Assert reviewdog is executable and produces output
        run: |
          echo "Running: reviewdog -version"
          VERSION_OUTPUT=$(reviewdog -version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: reviewdog -version produced no output"
            exit 1
          fi
          echo "PASS: nightly reviewdog is functional"
