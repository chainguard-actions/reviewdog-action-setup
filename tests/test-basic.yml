name: Test basic usage - install latest reviewdog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Setup reviewdog (latest)
        uses: .

      - name: Assert reviewdog is installed and executable
        run: |
          echo "Checking reviewdog is on PATH..."
          if ! command -v reviewdog > /dev/null 2>&1; then
            echo "FAIL: reviewdog command not found on PATH"
            exit 1
          fi
          echo "PASS: reviewdog found at $(command -v reviewdog)"

      - name: Assert reviewdog reports a version
        run: |
          VERSION_OUTPUT=$(reviewdog --version 2>&1 || true)
          echo "reviewdog version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: reviewdog --version produced no output"
            exit 1
          fi
          echo "PASS: reviewdog version reported"
